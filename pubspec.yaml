name: mealsmaster
description: A modern Flutter migration for Meals Master.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_staggered_grid_view: ^0.7.0
  dio: ^5.0.0
  equatable: ^2.0.7
  flutter_bloc: ^9.0.0
  get_it: ^9.2.1
  dartz: ^0.10.1
  cached_network_image: ^3.4.1
  google_fonts: ^8.0.2
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.webp"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
